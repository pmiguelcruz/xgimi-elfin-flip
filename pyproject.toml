[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# dbus-fast consumes these literal D-Bus signatures at runtime, not Python types.
"custom_components/xgimi_elfin_flip/local_ble.py" = ["F821", "F722"]
